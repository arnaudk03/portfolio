name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: backend
        run: mvn -B test

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npx ng test --watch=false --no-progress --browsers=ChromeHeadless

      - name: Build Frontend for GitHub Pages
        working-directory: frontend
        run: npx ng build --configuration production --base-href /portfolio/

      - name: Prepare SPA Routing (404.html & .nojekyll)
        run: |
          cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html
          touch frontend/dist/frontend/browser/.nojekyll

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist/frontend/browser
          branch: gh-pages
          commit-message: "deploy: automated build for GitHub Pages 🚀"
